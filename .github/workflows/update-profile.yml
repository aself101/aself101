name: update-profile

on:
  # A package repo pings this when it ships (see release-notify-snippet.yml).
  repository_dispatch:
    types: [package-shipped]
  # Safety net in case a ping is missed.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  # Re-render when the package list or script changes.
  push:
    branches: [main]
    paths:
      - packages.json
      - scripts/update-profile.mjs

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

# Personal profile repo (aself101/aself101): leave as is.
# UluOps org profile repo (<org>/.github): PROFILE=uluops, README_PATH=profile/README.md
env:
  PROFILE: personal
  README_PATH: README.md

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh generated blocks
        run: node scripts/update-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- "$README_PATH"; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$README_PATH"
          git commit -m "chore: update shipped packages"
          git push
